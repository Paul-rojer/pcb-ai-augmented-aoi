<svg viewBox="0 0 1200 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',Roboto,Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <style>
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;}
      .acc{fill:url(#acc);stroke:#6366f1;stroke-width:2;}
      .fpga{fill:#ede9fe;stroke:#7c3aed;stroke-width:2.5;}
      .t{fill:#0f172a;font-size:18px;font-weight:600;}
      .s{fill:#475569;font-size:13px;}
      .lbl{fill:#94a3b8;font-size:12px;font-weight:600;letter-spacing:1px;}
      .flow{stroke:#64748b;stroke-width:2.5;fill:none;}
    </style>
  </defs>

  <text x="40" y="42" class="t" font-size="22">AOI Inspection Pipeline</text>
  <text x="40" y="66" class="s">Golden-Template Registration + Unsupervised Change Detection + Software / FPGA Scoring + AOI/AI Consensus</text>

  <!-- Tier 1: pre-processing -->
  <rect x="40"  y="95" width="158" height="72" rx="12" class="box"/>
  <text x="119" y="127" class="t" font-size="15" text-anchor="middle">PCB Image</text>
  <text x="119" y="149" class="s" text-anchor="middle">raw or cropped</text>

  <rect x="230" y="95" width="158" height="72" rx="12" class="box"/>
  <text x="309" y="127" class="t" font-size="15" text-anchor="middle">ROI Crop</text>
  <text x="309" y="149" class="s" text-anchor="middle">auto rail removal</text>

  <rect x="420" y="95" width="176" height="72" rx="12" class="acc"/>
  <text x="508" y="127" class="t" font-size="15" text-anchor="middle">Board-Type Routing</text>
  <text x="508" y="149" class="s" text-anchor="middle">ORB feature match</text>

  <rect x="628" y="95" width="176" height="72" rx="12" class="acc"/>
  <text x="716" y="127" class="t" font-size="15" text-anchor="middle">Registration</text>
  <text x="716" y="149" class="s" text-anchor="middle">ORB + ECC align</text>

  <line x1="198" y1="131" x2="228" y2="131" class="flow" marker-end="url(#arr)"/>
  <line x1="388" y1="131" x2="418" y2="131" class="flow" marker-end="url(#arr)"/>
  <line x1="596" y1="131" x2="626" y2="131" class="flow" marker-end="url(#arr)"/>
  <line x1="716" y1="167" x2="716" y2="196" class="flow" marker-end="url(#arr)"/>

  <!-- Tier 2: dual-engine change-detection (software OR bit-identical FPGA) -->
  <rect x="380" y="198" width="440" height="148" rx="16" fill="#f8fafc" stroke="#6366f1" stroke-width="2"/>
  <text x="600" y="224" class="t" font-size="15" text-anchor="middle">Golden Change-Detection Engine</text>
  <text x="600" y="245" class="s" font-size="12.5" text-anchor="middle">z = |img &#8722; mean| / &#963;   &#183;   bit-identical output</text>

  <rect x="406" y="262" width="186" height="64" rx="10" class="box"/>
  <text x="499" y="290" class="t" font-size="14" text-anchor="middle">Software Engine</text>
  <text x="499" y="310" class="s" text-anchor="middle">OpenCV &#183; NumPy</text>

  <rect x="610" y="262" width="186" height="64" rx="10" class="fpga"/>
  <text x="703" y="290" class="t" font-size="14" text-anchor="middle" fill="#5b21b6">FPGA Engine</text>
  <text x="703" y="310" class="s" text-anchor="middle" fill="#6d28d9">Cyclone IV &#183; 115.67 MHz</text>

  <line x1="820" y1="272" x2="860" y2="272" class="flow" marker-end="url(#arr)"/>

  <rect x="862" y="236" width="170" height="72" rx="12" class="box"/>
  <text x="947" y="268" class="t" font-size="15" text-anchor="middle">Anomaly</text>
  <text x="947" y="290" class="s" text-anchor="middle">score + heatmap</text>

  <line x1="947" y1="308" x2="947" y2="376" class="flow" marker-end="url(#arr)"/>

  <!-- Tier 3: decision + consensus -->
  <rect x="846" y="380" width="200" height="64" rx="12" class="box"/>
  <text x="946" y="408" class="t" font-size="15" text-anchor="middle">AI Decision</text>
  <text x="946" y="428" class="s" text-anchor="middle">PASS / REVIEW / FAIL</text>

  <rect x="40" y="380" width="220" height="64" rx="12" class="box"/>
  <text x="150" y="408" class="t" font-size="15" text-anchor="middle">AOI Machine Verdict</text>
  <text x="150" y="428" class="s" text-anchor="middle">from _G / _N or operator</text>

  <rect x="470" y="372" width="260" height="84" rx="14" fill="#0f172a"/>
  <text x="600" y="406" fill="#ffffff" font-size="17" font-weight="600" text-anchor="middle">AOI + AI Consensus</text>
  <text x="600" y="430" fill="#cbd5e1" font-size="13" text-anchor="middle">agree &#8594; auto &#183; disagree &#8594; review</text>

  <line x1="260" y1="412" x2="468" y2="412" class="flow" marker-end="url(#arr)"/>
  <line x1="846" y1="412" x2="732" y2="412" class="flow" marker-end="url(#arr)"/>
  <line x1="600" y1="456" x2="600" y2="502" class="flow" marker-end="url(#arr)"/>

  <!-- Tier 4: outputs -->
  <rect x="300" y="505" width="180" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="390" y="538" fill="#166534" font-size="16" font-weight="700" text-anchor="middle">CONFIRMED PASS</text>
  <text x="390" y="559" fill="#166534" font-size="12" text-anchor="middle">auto-cleared</text>

  <rect x="510" y="505" width="180" height="72" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="538" fill="#92400e" font-size="16" font-weight="700" text-anchor="middle">HUMAN REVIEW</text>
  <text x="600" y="559" fill="#92400e" font-size="12" text-anchor="middle">disagreement</text>

  <rect x="720" y="505" width="180" height="72" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="810" y="538" fill="#991b1b" font-size="16" font-weight="700" text-anchor="middle">CONFIRMED FAIL</text>
  <text x="810" y="559" fill="#991b1b" font-size="12" text-anchor="middle">defect</text>

  <line x1="600" y1="456" x2="402" y2="502" class="flow" marker-end="url(#arr)"/>
  <line x1="600" y1="456" x2="798" y2="502" class="flow" marker-end="url(#arr)"/>

  <text x="40" y="615" class="lbl">AOI PRO &#183; AOI PRO &#183; OpenCV / NumPy / FastAPI &#183; Software / FPGA engines &#183; separation AUC 0.83 &#183; ~82% auto-decided</text>
</svg>
